# Site config included in nginx's http context. Verify against the live PHP 8.4 image.
# Only the exact Azure frontend HTTPS marker is consumed. Laravel does not trust
# arbitrary X-Forwarded-Host/Port/For headers with this deployment configuration.
map $http_x_forwarded_proto $trackpro_https {
    default off;
    https on;
}
map $trackpro_https $trackpro_port {
    default 80;
    on 443;
}
map $trackpro_https $trackpro_scheme {
    default http;
    on https;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /home/site/wwwroot/public;
    index index.php;
    server_tokens off;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The front controller is the only executable PHP path.
    location = /index.php {
        try_files /index.php =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME $trackpro_scheme;
        fastcgi_param HTTPS $trackpro_https;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT $trackpro_port;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.php(?:/|$) { return 404; }
    location ~ /\. { deny all; }
}
